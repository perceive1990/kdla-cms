# Tests every change, and deploys the main branch to Azure App Service.
#
# One-time setup: in Azure Cloud Shell, from the project folder, run
#   bash infra/github-setup.sh <github-account>/<repository>
# It connects this repository to the Azure web app with OpenID Connect (no password or key is stored in
# GitHub) and saves these settings under Settings > Secrets and variables > Actions:
#   secrets   AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID
#   variable  AZURE_WEBAPP_NAME
# Alternative: put a publish profile in the secret AZURE_WEBAPP_PUBLISH_PROFILE (the script does this
# automatically when your Azure account is not allowed to grant the deployment role).
name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test

  deploy:
    name: Deploy to Azure
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # lets GitHub prove to Azure that this run comes from this repository's main branch
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      APP_NAME: ${{ vars.AZURE_WEBAPP_NAME }}
      USE_OIDC: ${{ secrets.AZURE_CLIENT_ID != '' }}
      USE_PROFILE: ${{ secrets.AZURE_CLIENT_ID == '' && secrets.AZURE_WEBAPP_PUBLISH_PROFILE != '' }}
    steps:
      - name: Check that this repository is connected to Azure
        if: env.APP_NAME == '' || (env.USE_OIDC != 'true' && env.USE_PROFILE != 'true')
        run: |
          echo "::error title=Not connected to Azure yet::In Azure Cloud Shell, from the project folder, run: bash infra/github-setup.sh ${{ github.repository }}"
          exit 1

      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Package the app (Azure installs the dependencies during deployment)
        run: node scripts/package.js app.zip

      - name: Sign in to Azure
        if: env.USE_OIDC == 'true'
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy
        if: env.USE_OIDC == 'true'
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.APP_NAME }}
          package: app.zip

      - name: Deploy with the publish profile
        if: env.USE_PROFILE == 'true'
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.APP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: app.zip

      - name: Check that the site and database answer
        run: |
          url="https://${APP_NAME}.azurewebsites.net/healthz?db=1"
          # The free plan restarts and installs packages after a deployment, which can take a few minutes.
          for attempt in $(seq 1 30); do
            if curl --silent --show-error --fail --max-time 30 "$url"; then
              echo
              echo "Deployed: https://${APP_NAME}.azurewebsites.net"
              exit 0
            fi
            echo "Waiting for the site to start (attempt ${attempt} of 30)..."
            sleep 10
          done
          echo "::error title=Site not answering::${url} did not answer within about 5 minutes. In the Azure portal, open the web app and check Log stream."
          exit 1
